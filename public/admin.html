<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台 · SmartOps</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body data-page="admin"><header class="topbar"><a class="brand" href="/admin.html"><span class="logo">S</span>SmartOps</a><nav><button class="secondary" id="ticketTab">工单管理</button><button class="secondary" id="adminTab">账号管理</button><button class="secondary" id="passwordTab">修改密码</button><button class="secondary" id="logout">退出登录</button></nav></header>
<main class="page"><div id="message" class="message" role="status" hidden></div><section id="ticketSection" hidden><div class="page-heading"><div><p class="eyebrow">SERVICE DESK</p><h1>工单管理</h1><p id="welcome" class="muted"></p></div><a class="button secondary" href="/report.html">提交报修</a></div><div class="card"><form class="toolbar" id="filterForm"><label for="search" class="sr-only">搜索工单</label><input id="search" maxlength="160" placeholder="搜索标题、科室或完整编号"><label for="statusFilter" class="sr-only">筛选状态</label><select id="statusFilter"><option value="">全部状态</option><option value="pending">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select><button type="submit">查询</button></form><div class="table-wrap"><table><thead><tr><th>工单 / 标题</th><th>科室</th><th>类型</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="ticketRows"></tbody></table></div><div id="empty" class="empty" hidden>暂时没有工单</div><div class="pagination"><span id="count" class="muted"></span><div><button id="previous" class="secondary">上一页</button><button id="next" class="secondary">下一页</button></div></div></div><p class="card-note">这里显示新版报修入口提交的工单。旧入口的历史工单尚未接入。</p></section>
<section id="adminSection" hidden><div class="page-heading"><div><p class="eyebrow">ACCESS MANAGEMENT</p><h1>管理员账号</h1><p class="muted">维护可以访问工单和账号管理的人员</p></div></div><div class="split"><div class="card"><h2>已授权管理员</h2><div class="table-wrap"><table><thead><tr><th>姓名 / 邮箱</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="adminRows"></tbody></table></div></div><div class="card"><h2>新增管理员</h2><form id="adminForm"><label for="adminName">姓名</label><input id="adminName" required maxlength="80"><label for="adminEmail">账号邮箱</label><input id="adminEmail" type="email" required maxlength="254" autocomplete="off"><label for="adminPassword">临时密码</label><input id="adminPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><button class="full" type="submit">添加管理员</button></form><p class="card-note">新账号首次登录必须修改临时密码。请通过可信渠道将账号信息交给本人。</p></div></div></section>
<section id="passwordSection" hidden><div class="card password-card"><h1>修改密码</h1><p class="muted" id="passwordHint">设置至少 12 个字符的新密码。</p><form id="passwordForm"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="128"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirmPassword">再次输入新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button type="submit" class="full">保存新密码</button></form><p class="card-note">修改后其他设备上的登录会话将失效。</p></div></section></main>
<section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden><div class="detail-card"><div class="detail-head"><div><p class="eyebrow">TICKET DETAIL</p><h2 id="detailTitle">工单详情</h2></div><button id="closeDetail" class="secondary" aria-label="关闭工单详情">关闭</button></div><dl id="detailFields"></dl><form id="statusForm"><label for="detailStatus">处理状态</label><select id="detailStatus"><option value="pending">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select><button type="submit" class="full">保存状态</button></form><div id="detailMessage" role="status" class="message" hidden></div></div></section></body></html>
