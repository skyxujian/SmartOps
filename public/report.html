<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交报修 · SmartOps</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body data-page="report"><header class="topbar"><a class="brand" href="/"><span class="logo">S</span>SmartOps</a><nav><a href="/">管理员登录</a></nav></header><main class="report"><section class="card"><p class="eyebrow">NEW REQUEST</p><h1>提交报修工单</h1><p class="muted">请填写问题现象与联系方式，便于 IT 人员跟进处理。</p><div id="message" class="message" role="status" hidden></div><form id="reportForm"><div class="row"><div><label for="department">报修科室 *</label><select id="department" required><option value="">请选择科室</option><option>IT部</option><option>行政部</option><option>财务部</option><option>儿科</option><option>妇科</option><option>产科</option><option>手术室</option><option>收费处</option><option>挂号处</option></select></div><div><label for="type">问题类型 *</label><select id="type" required><option value="">请选择</option><option>网络问题</option><option>电脑故障</option><option>系统登录</option><option>打印机</option><option>其他</option></select></div></div><label for="title">问题标题 *</label><input id="title" required minlength="3" maxlength="160" placeholder="例如：收费处电脑无法连接网络"><label for="description">问题描述 *</label><textarea id="description" required minlength="5" maxlength="5000" placeholder="请描述出现时间、问题现象和已尝试的操作，请勿填写密码等敏感信息"></textarea><div class="row"><div><label for="contact">联系方式 *</label><input id="contact" required maxlength="160" placeholder="姓名 / 电话 / 内线"></div><div><label for="remark">备注</label><input id="remark" maxlength="1000" placeholder="例如：下午两点后方便联系"></div></div><button class="full" type="submit">提交工单</button></form><p class="card-note">提交成功后请保存工单编号。管理员可在工作台中查看和处理。</p></section></main><footer class="footer">SmartOps · IT 运维支持系统</footer></body></html>
